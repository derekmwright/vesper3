version: '3'

# Vesper III — build, check, capture and package.
#
#   task            what to run, listed
#   task run        play it
#   task check      everything CI would run
#   task dist       release binaries
#
# Every recipe here was a command written out by hand first. They are collected
# rather than invented: if a target looks over-specified, it is because the
# flags in it are the ones that make a result reproducible — a screenshot taken
# without -camdist and -timeofday is not a capture anyone can re-take.

vars:
  BIN: vesper
  # Windows needs the suffix; everything else does not.
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  DIST: dist

  # Longest texture edge in a shipped model. The authored maps are 2048 and
  # stay that way in assets/models-src; this is only what gets baked.
  TEXSIZE: 512

  # Stamped into the binary so a bug report can say which build it came from.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    desc: List what there is to run
    silent: true
    cmds: [task --list]

  # ---------------------------------------------------------------- building

  build:
    desc: Build the game
    sources:
      - '**/*.go'
      - assets/**/*
      - go.mod
      - go.sum
    generates: ['{{.BIN}}{{.EXE}}']
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BIN}}{{.EXE}} .

  run:
    desc: Play it. Pass flags after -- (task run -- -seed 12345)
    cmds:
      - go run . {{.CLI_ARGS}}

  # ---------------------------------------------------------------- checking

  check:
    desc: Everything CI runs — formatting, vet, tests, and the art contract
    cmds:
      - task: fmt-check
      - task: vet
      - task: test
      - task: models:check

  fmt:
    desc: Format every Go file
    cmds:
      - gofmt -w .

  fmt-check:
    desc: Fail if anything is unformatted
    cmds:
      # gofmt -l exits 0 whatever it finds, so the output is the test.
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "not gofmt'd:" >&2
          echo "$unformatted" >&2
          exit 1
        fi

  vet:
    cmds: [go vet ./...]

  test:
    desc: Run the test suite
    cmds:
      - go test ./... {{.CLI_ARGS}}

  test:race:
    desc: Run the tests under the race detector
    cmds:
      - go test -race ./...

  cover:
    desc: Test coverage, as a browsable report
    cmds:
      - go test -coverprofile={{.DIST}}/coverage.out ./...
      - go tool cover -html={{.DIST}}/coverage.out -o {{.DIST}}/coverage.html
      - echo "{{.DIST}}/coverage.html"
    deps: [dist-dir]

  # ------------------------------------------------------------------- media

  shot:
    desc: Take a reproducible screenshot (task shot -- -seed 7 -demo)
    vars:
      OUT: '{{.OUT | default "shot.png"}}'
    cmds:
      # The camera, cursor and clock are pinned on purpose. A capture that
      # depends on where the mouse happened to be, or on what time of day the
      # run reached, is not evidence anyone can reproduce.
      - >-
        go run . -frames 140 -nosplash -screenshot {{.OUT}}
        -camdist 9 -campitch 0.45 -camyaw 0.9
        -cursorx 0.45 -cursory 0.6
        -timeofday 0.35 -daylen -1
        {{.CLI_ARGS}}
      - echo "wrote {{.OUT}}"

  icons:
    desc: Repack assets/icons-src into the HUD atlas
    sources: ['assets/icons-src/*.png']
    generates: ['assets/icons.png']
    cmds:
      - go run ./cmd/iconatlas -src assets/icons-src -out assets/icons.png

  models:
    desc: Re-author the models with Blender, then bake and verify them
    cmds:
      # build.sh writes to assets/models-src and refuses to promote an export
      # that does not pass models:check. The bake below is what the game
      # actually embeds.
      - tools/models/build.sh
      - task: models:bake

  models:bake:
    desc: Bake assets/models-src down to the textures the game ships
    sources: ['assets/models-src/*.glb']
    generates: ['assets/models/*.glb']
    cmds:
      # The models are authored with 2048x2048 maps, which is the right thing
      # to keep and the wrong thing to ship: a structure covers about a hundred
      # pixels at this camera distance, and eight pairs of 2048 maps took the
      # binary to seventy-two megabytes. At 512 the difference is invisible at
      # three times magnification and the game is a third of the size.
      - go run ./cmd/texscale -src assets/models-src -out assets/models -size {{.TEXSIZE}}
      - task: models:check

  models:check:
    desc: Check the models still carry what the game reads from them
    cmds:
      # The battery's charge strips and status lamp, the condenser's fin band
      # and the greenhouse's grow lamps are found by matching a base colour. A
      # model exported without them loads perfectly and simply never lights up,
      # so this is the only thing standing between a re-export and a feature
      # quietly disappearing.
      - go run ./cmd/modelcheck assets/models-src/*.glb
      - go run ./cmd/modelcheck assets/models/*.glb

  # ------------------------------------------------------------- distributing

  dist-dir:
    internal: true
    cmds: ['mkdir -p {{.DIST}}']
    status: ['test -d {{.DIST}}']

  dist:
    desc: Build something you can hand to someone
    deps: [dist-dir]
    cmds:
      - task: check
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/{{.BIN}}{{.EXE}} .

      # What goes beside it, and nothing else. A player should be able to
      # double-click one file; the other two are there because someone will
      # want to know what the controls are and because the font's licence
      # requires travelling with it.
      - cp PLAYING.md {{.DIST}}/README.md
      - cp assets/fonts/OFL.txt {{.DIST}}/LICENSE-Exo2.txt
      # The project's own licence, when there is one. task's built-in cp is
      # not a shell and fails outright on a missing source, so the existence
      # check has to happen before it is called rather than after.
      - cmd: |
          if [ -f LICENSE ]; then
            cp LICENSE {{.DIST}}/
          else
            echo "note: no LICENSE in the repository root; none shipped" >&2
          fi
      # Reported with du rather than by parsing ls: task runs recipes through
      # its own shell, whose ls is not GNU ls and does not print the columns an
      # awk written against GNU ls would be counting.
      - cmd: |
          echo
          echo "{{.DIST}}/  {{.VERSION}}"
          du -h {{.DIST}}/* | sed 's|^|  |'
          echo
          echo "  One executable. Every asset is embedded - nothing to install,"
          echo "  nothing to unpack. Needs a Vulkan 1.1 driver."

  dist:zip:
    desc: Package the dist folder for sending
    deps: [dist]
    cmds:
      - cmd: |
          name="{{.BIN}}-{{.VERSION}}-{{OS}}-{{ARCH}}"
          rm -f "$name.zip"
          (cd {{.DIST}} && zip -qr "../$name.zip" .)
          ls -la "$name.zip" | awk '{printf "%s  %.1f MB\n", $9, $5/1048576}'

  dist:cross:
    desc: Cross-compile release binaries (needs zig; see the README)
    deps: [dist-dir]
    cmds:
      # GLFW is cgo, so a cross build needs a cross C toolchain. zig cc is the
      # one that works without installing a per-target gcc, which is why it is
      # named here rather than left as an exercise.
      - task: cross
        vars: {GOOS: linux, GOARCH: amd64, CC: 'zig cc -target x86_64-linux-gnu', SUFFIX: ''}
      - task: cross
        vars: {GOOS: windows, GOARCH: amd64, CC: 'zig cc -target x86_64-windows-gnu', SUFFIX: '.exe'}
      - ls -la {{.DIST}}

  cross:
    internal: true
    cmds:
      - >-
        CGO_ENABLED=1 GOOS={{.GOOS}} GOARCH={{.GOARCH}} CC="{{.CC}}"
        go build -trimpath -ldflags "{{.LDFLAGS}}"
        -o {{.DIST}}/{{.BIN}}-{{.GOOS}}-{{.GOARCH}}{{.SUFFIX}} .

  clean:
    desc: Remove build output
    cmds:
      - rm -rf {{.DIST}} {{.BIN}}{{.EXE}} shot.png
